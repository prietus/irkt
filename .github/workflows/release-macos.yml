name: release-macos

# Builds, signs (Developer ID) and notarizes the macOS arm64 binary, then
# attaches the zip to the GitHub release for the pushed tag.
#
# Required repo secrets (set with `gh secret set`):
#   Signing (the identity name is read from the cert, so no secret for it):
#     MACOS_CERT_P12          base64 of your "Developer ID Application" .p12
#     MACOS_CERT_PASSWORD     password you set when exporting that .p12
#     MACOS_KEYCHAIN_PASSWORD any password (for the temporary CI keychain)
#   Notarization (Apple ID method):
#     AC_APPLE_ID             your Apple ID email
#     AC_PASSWORD             an app-specific password (appleid.apple.com)
#     AC_TEAM_ID              your 10-char Team ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build & attach the binary to"
        required: true

permissions:
  contents: write

jobs:
  build:
    # macos-14 is Apple Silicon, so `cargo build --release` is arm64 natively.
    runs-on: macos-14
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (release, arm64)
        run: cargo build --release --locked

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo -n "$MACOS_CERT_P12" | base64 --decode -o "$CERT_PATH"

          # Create an isolated, short-lived keychain so we never touch the
          # runner's defaults.
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Import the whole identity (cert + private key). `-A` lets codesign
          # use the key without an ACL prompt; do NOT pass `-t cert`, which would
          # import only the certificate and drop the key.
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" \
            -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "Identities in build keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign (hardened runtime + secure timestamp)
        run: |
          set -euo pipefail
          # Derive the identity name straight from the keychain — no secret to
          # keep in sync, so it can never mismatch the imported certificate.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F\" '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in the keychain." >&2
            echo "Is MACOS_CERT_P12 a Developer ID Application cert exported WITH its private key?" >&2
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          BIN=target/release/irkt
          codesign --force --timestamp --options runtime --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Notarize
        env:
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: |
          set -euo pipefail
          ASSET="irkt-${TAG}-macos-arm64.zip"
          # notarytool only accepts a container (zip/dmg/pkg), not a bare binary.
          ditto -c -k --keepParent target/release/irkt "$ASSET"
          xcrun notarytool submit "$ASSET" \
            --apple-id "$AC_APPLE_ID" \
            --password "$AC_PASSWORD" \
            --team-id "$AC_TEAM_ID" \
            --wait
          # A standalone CLI binary can't be stapled (only .app/.dmg/.pkg can),
          # so Gatekeeper verifies the notarization online on first run. We ship
          # the same notarized zip we submitted.
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --generate-notes \
            || echo "release $TAG already exists"
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
