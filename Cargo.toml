[package]
name = "irkt"
version = "0.1.0"
edition = "2024"
description = "A modern terminal IRC client with full IRCv3, SASL/CertFP, and inline images"
license = "MIT"
authors = ["Carlos Prieto Ortiz <prietus@live.com>"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
irc = "1.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
time = { version = "0.3", default-features = false, features = ["local-offset"] }

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Inline images
ratatui-image = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }

# Utilities
indexmap = "2"
unicode-width = "0.2"
mime_guess = "2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
